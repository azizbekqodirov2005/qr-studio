<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#477BFF" />
    <meta name="description" content="QR Studio — veb-sayt, vizitka, PDF, galereya, ijtimoiy tarmoqlar, biznes sahifa va Wi-Fi uchun QR kodlar yarating." />
    <meta property="og:title" content="QR Studio" />
    <meta property="og:type" content="website" />
    <title>QR Studio</title>
    <script>
      (function () {
        try {
          var m = localStorage.getItem('qrstudio.theme') || 'system';
          if (m === 'dark' || (m === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
